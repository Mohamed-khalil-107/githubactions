name: "Jobs-Workflow"
on:
  workflow_dispatch:

jobs: 
  job_1:
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm install
          npm run build 
        working-directory : ./tmp
        shell : shell  
  job_2:
    runs-on: ubuntu-latest
    needs: job_1
    steps:
      - run: ls ./tmp
