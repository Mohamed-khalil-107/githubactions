name: Manual Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "choose environment"
        required: true
        default: "stage"
        type: choice
        options:
          - stage
          - production

jobs:
  daily_task:
    runs-on: ubuntu-22.04
    steps:
      - name: Deployment Message
        run: |
          echo "Selected environment: ${{ github.event.inputs.environment }}"
