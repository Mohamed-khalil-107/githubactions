on:
  workflow_dispatch:

jobs:
  job_1:
    strategy:
      fast-fail: false
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [14.x, 15.x, 16.x]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: ${{ matrix.node-version }}
